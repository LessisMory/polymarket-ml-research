[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polymarket-irl"
version = "0.1.0"
description = "Research workflow for Polymarket market microstructure modeling and inverse reinforcement learning analysis."
requires-python = ">=3.10"
readme = "README.md"

[tool.setuptools.packages.find]
where = ["src"]
